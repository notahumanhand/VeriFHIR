services:
  - type: web
    name: fhir-source-validation
    runtime: python
    plan: pro
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VISION_ENDPOINT
        sync: false
      - key: VISION_KEY
        sync: false
